name: Build & publish Windows

# Build bản cài Windows từ mã nguồn (repo private imroytran/simple_pos) tại một tag, rồi phát hành
# ngay trong repo public này — Actions của repo public không tính phút.
# Chạy:  gh workflow run build-windows.yml --repo imroytran/simpos-releases -f tag=v1.2.15
#
# Secrets cần có trong repo này:
#   SOURCE_REPO_TOKEN                   fine-grained token, chỉ repo simple_pos, quyền Contents: Read-only
#   TAURI_SIGNING_PRIVATE_KEY           nội dung ~/.tauri/simpos-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  mật khẩu của khoá trên
#
# Chỉ chạy tay (workflow_dispatch: cần quyền ghi repo), không có trigger pull_request, nên secrets
# không bao giờ lộ cho workflow từ fork. Log của repo public ai cũng xem được: không in secrets.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag trong repo nguồn, ví dụ v1.2.15'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  build-windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    steps:
      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag không hợp lệ: $RELEASE_TAG (cần dạng vX.Y.Z)"; exit 1
          fi

      - name: Configure git (long paths, safe directory, identity)
        shell: bash
        run: |
          git config --global core.longpaths true
          git config --global --add safe.directory '*'
          git config --global user.email "ci@simpos.local"
          git config --global user.name "Simpos CI"

      - name: Checkout source (private)
        uses: actions/checkout@v4
        with:
          repository: imroytran/simple_pos
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: src
          filter: blob:none
          # Giữ mặc định persist-credentials: tắt đi thì checkout chạy `git submodule foreach` để gỡ
          # token và hỏng vì repo nguồn có mục .react-branch-temp lưu như submodule thiếu .gitmodules.

      # latest.json lấy tag từ version trong tauri.conf.json — phải trùng tag được build.
      - name: Check version matches tag
        working-directory: src/pos-tauri-v2
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "tauri.conf.json là $version, không khớp tag $RELEASE_TAG"; exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/pos-tauri-v2/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/pos-tauri-v2/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/pos-tauri-v2/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: src/pos-tauri-v2
        run: npm ci

      - name: Typecheck
        working-directory: src/pos-tauri-v2
        run: npm run typecheck

      # target/ được cache nên bundle/ còn installer của các bản trước: xoá để chỉ còn bản đang build.
      - name: Remove old bundles
        working-directory: src/pos-tauri-v2
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      # Build trực tiếp (không dùng tauri-action) để giữ file .sig cho generate-latest-json.mjs.
      - name: Build Tauri app (signed updater artifacts)
        working-directory: src/pos-tauri-v2
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Generate latest.json
        working-directory: src/pos-tauri-v2
        shell: bash
        run: node scripts/generate-latest-json.mjs --notes "Bản cập nhật $RELEASE_TAG"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: src/pos-tauri-v2/src-tauri/target/release/bundle/nsis
        run: |
          v="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "SIMPOS $RELEASE_TAG" \
            --notes "Bản cập nhật $RELEASE_TAG. Installer hiện chưa ký Authenticode — SmartScreen sẽ cảnh báo lần cài đầu." \
            *_${v}_*-setup.exe *_${v}_*-setup.exe.sig latest.json \
          || gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            *_${v}_*-setup.exe *_${v}_*-setup.exe.sig latest.json
